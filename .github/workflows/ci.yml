name: CI

on:
  pull_request:
  push:
    branches: [main]

# Le jeton GitHub de la CI ne peut que lire le dépôt.
permissions:
  contents: read

# Un nouveau push sur la même branche annule la vérification en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, format, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances (exactement le lock)
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Tests
        run: npm test

      # Un script npm ou un module natif ajouté change l'empreinte : les mises à jour EAS
      # n'atteindraient plus les APK installés. Voir scripts/check-fingerprint.sh.
      - name: Empreinte runtime compatible avec les APK installés
        run: bash scripts/check-fingerprint.sh

  integration:
    name: Tests d'intégration (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances (exactement le lock)
        run: npm ci

      # Base, authentification, API REST et passerelle (kong) suffisent aux tests :
      # les autres services sont coupés pour démarrer plus vite. Les migrations sont appliquées au démarrage.
      - name: Démarrer Supabase en local
        # Stockage (storage-api) gardé : les photos de profil sont testées (photos.test.ts).
        run: npx supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Tests d'intégration
        run: bash tests/integration/run.sh

      - name: Arrêter Supabase
        if: always()
        run: npx supabase stop --no-backup

  e2e:
    name: Tests de bout en bout (navigateur)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      # Les deux paquets : l'app (pour l'export web) et les tests (Playwright).
      - name: Installer les dépendances (exactement les locks)
        run: |
          npm ci
          npm ci --prefix e2e

      - name: Installer Chromium
        run: npx --prefix e2e playwright install --with-deps chromium

      # Realtime gardé, contrairement au job d'intégration : c'est ce qu'on teste.
      - name: Démarrer Supabase en local
        run: npx supabase start -x imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Tests de bout en bout
        run: bash e2e/run.sh

      # En cas d'échec : la trace (captures, réseau, console) à ouvrir avec
      # npx playwright show-trace, depuis l'onglet Summary du run.
      - name: Garder le rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Arrêter Supabase
        if: always()
        run: npx supabase stop --no-backup
